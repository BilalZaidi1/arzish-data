name: Daily market data

on:
  schedule:
    # 06:40 and 07:40 Pakistan time (UTC+5), before the daily Claude agent (about 08:40): picks up
    # the previous evening's SBP rates, the fund dataset's overnight NAV update (~03:30) and
    # PSX's previous closing prices. The second run is a retry slot.
    - cron: "40 1 * * *"
    - cron: "40 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - "build.py"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Scrape and build
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "arzish-data-bot"
          git config user.email "arzish-data-bot@users.noreply.github.com"
          git add -A data raw
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
